# ==========================================================
# WSI Framework Configuration
# ==========================================================
# This file controls all parameters for the WSI pipeline, 
# from raw slide processing to deep learning feature extraction 
# and multiple instance learning.

paths:
  # Directory containing raw WSI files
  slides_dir: "/lustre/naffi/gastric_svs_files"
  
  # Directory containing manual annotations (optional)
  annotations_dir: "dataset/annotations"
  
  # Root directory where all generated artifacts will be saved
  results_dir: "results"

dataset:
  # The file extension of the raw whole slide images
  slide_extension: ".svs"

# ─── Tissue Segmentation ─────────────────────────────────────────────────────
segmentation:
  seg_level: -1         # Pyramid level for segmentation (-1 = auto ~64x downsample)
  sthresh: 8            # Binary saturation threshold (ignored if use_otsu: true)
  mthresh: 7            # Median blur kernel size (odd number)
  close: 4              # Morphological closing kernel size (0 to skip)
  use_otsu: false       # Use Otsu's method instead of fixed threshold
  vis_level: -1         # Pyramid level for mask visualization (-1 = auto)
  line_thickness: 10   # Contour line thickness in mask image

# ─── Contour Filtering ───────────────────────────────────────────────────────
filter:
  a_t: 100              # Min tissue contour area (in ref-patch units)
  a_h: 16               # Min hole area to keep (in ref-patch units)
  max_n_holes: 8        # Max holes per tissue contour
  ref_patch_size: 512   # Reference patch size used for area scaling

# ─── Patch Tiling ────────────────────────────────────────────────────────────
tiling:
  patch_level: 0        # Pyramid level to extract patches from (0 = full res)
  patch_size: 512     # Patch width/height in pixels
  step_size: 512       # Step size between patches (= patch_size for no overlap)
  contour_fn: "four_pt" # Contour check: four_pt | four_pt_hard | center | basic
  use_padding: true     # Allow patches that extend beyond the bounding box edge
  filter_blank: true    # Skip white/black (background) patches
  white_thresh: 15      # HSV saturation threshold for white-patch detection
  black_thresh: 40      # RGB mean threshold for black-patch detection
  mode: "parallel"    # Execution mode: sequential or parallel
  num_workers: 8        # CPU Cores for parallel mode

  # ── Subfolder override ───────────────────────────────────────────────────────
  # By default patches are stored in patches/patch{size}_step{step}_level{lvl}/
  # Set this to redirect segment output (and the extract input) to a custom name.
  # CLI flag --patches takes priority over this key.
  # Example: patches_subfolder_override: "patch256_step256_level0_otsu"
  # By Default: patches_subfolder_override: null
  patches_subfolder_override: null

feature_extraction:
  # Deep learning feature encoder (e.g., 'rn50', 'uni', 'virchow', 'optimus')
  model: optimus

  # ── Batching ─────────────────────────────────────────────────────────────────
  # Per-GPU batch size. A100 (80 GB) can handle 256+ for most ViT models.
  batch_size: 256

  # ── Multi-GPU parallelism ────────────────────────────────────────────────────
  # Number of GPU worker processes to spawn. Each process gets a disjoint
  # subset of slides. Defaults to the number of available CUDA GPUs.
  # Set to 1 to disable multi-process mode (useful for debugging).
  num_extraction_workers: 4   # set to 1 for single-GPU / debug

  # DataLoader workers PER GPU process. These pre-fetch patches from disk
  # while the GPU runs the forward pass, dramatically raising GPU utilisation.
  # 4–8 is recommended. Set to 0 to revert to the old single-thread behaviour.
  dataloader_workers: 4

  # Pin host memory for faster CPU → GPU tensor transfers (recommended: true)
  pin_memory: true

  # FP16 autocast (torch.cuda.amp). Doubles throughput on A100/H100 GPUs.
  # Features are cast back to float32 before saving.
  use_amp: true

  # Resizes raw extracted patch before feeding to model (set to -1 to disable)
  target_patch_size: -1

  # Transform preset to apply before feature extraction.
  # 'auto' selects the canonical pipeline for the chosen model.
  # Other options: none, reinhard, macenko, uni_default, gigapath_default, etc.
  transforms: auto

  # ── Feature subfolder override ────────────────────────────────────────────────
  # Five resolution tiers (highest priority first):
  #
  #  1. CLI --feature_dir <exact>         exact subfolder, model NOT appended
  #     → results/features/<exact>/
  #
  #  2. CLI --features <base>             base name, model auto-appended
  #     → results/features/<base>__<model>/
  #
  #  3. features_subfolder_override (below): base name, model auto-appended
  #     → results/features/<override>__<model>/
  #
  #  4. features_dir_override (below):    exact subfolder, model NOT appended
  #     → results/features/<override>/
  #
  #  5. Auto-derived (no override):
  #     → results/features/patch{size}_step{step}_level{lvl}__<model>/
  #
  # Leave both null to use fully auto-derived naming.

  # BASE name override; model key is always auto-appended.
  # Example: "patch512_step512_level0"  → features/patch512_step512_level0__rn50/
  features_subfolder_override: null

  # EXACT subfolder name; model is NOT appended. Use when you want to point
  # directly to a pre-existing feature directory (e.g. from another run).
  # Example: "patch512_step512_level0__uni"
  features_dir_override: null


task:
  # Name of the classification task
  name: metastasis
  # 'binary' | 'multiclass'
  type: binary
  # Number of output classes (2 for binary)
  num_classes: 2
  # Class names in label-index order
  class_names: [Non_heterogenous, Heterogenous]

# --- Dataset Splitting ----------------------------------------------------------
split:
  # 'train_test' | 'train_val_test'
  type: train_val_test
  train_size: 0.7
  val_size: 0.1         # only used in train_val_test
  test_size: 0.2
  stratified: true
  random_seed: 42

mil:
  # Model: abmil | clam_sb | clam_mb | mean_pool | max_pool | transmil | dsmil
  model: abmil

  # Must match the feature extractor output dim
  # rn50=2048, rn18=512, uni/vit_l=1024, optimus/gigapath=1536, hibou_b/phikon=768
  encoding_size: 1536

  # Internal projection dimension (attention, bag clf, instance clf layers).
  # Tunable independently of encoding_size. Mapped from HPO's feature_proj_dim.
  proj_dim: 512

  # Attention network hidden dimension
  hidden_dim: 256

  # Dropout probability applied to projection and bag-classification layers.
  # Default: 0.4 (recommended for overfitting mitigation)
  dropout: 0.4

  # CLAM: number of top/bottom patches for instance clustering
  k_sample: 8

  # CLAM: weight for bag vs instance loss (1.0 = bag only)
  bag_weight: 0.7

training:
  max_epochs: 100

  # ── Optimizer ────────────────────────────────────────────────────────────────
  # Optimizer: Adam | AdamW
  optimizer: AdamW

  # Learning rate for the optimizer.
  # Default: 2e-3 (per reference implementation)
  learning_rate: 2.0e-3

  # L2 regularization / weight decay to prevent overfitting.
  # Default: 1e-3 (reg in reference implementation)
  weight_decay: 1.0e-3

  # Adam β₁ — first moment decay rate. Default: 0.75
  beta1: 0.75

  # Adam β₂ — second moment decay rate. Default: 0.95
  beta2: 0.95

  # Adam ε — numerical stability constant. Default: 1e-2
  eps: 1.0e-2

  # ── LR Scheduler ─────────────────────────────────────────────────────────────
  # LR scheduler: plateau | cosine | step
  lr_scheduler: plateau

  # Multiplicative decay factor applied when plateau is detected.
  # Default: 0.75 (lr_factor in reference implementation)
  lr_scheduler_factor: 0.75

  # Number of epochs with no improvement before LR is reduced.
  # Default: 20 (lr_patience in reference implementation)
  lr_scheduler_patience: 20

  # ── Early stopping ───────────────────────────────────────────────────────────
  early_stopping: true
  early_stopping_patience: 20
  early_stopping_min_epochs: 10

  # Class weighting for imbalanced datasets
  weighted_loss: false

  # DataLoader
  num_workers: 0

  # ── Overfitting mitigation ───────────────────────────────────────────────────
  # Cross-entropy label smoothing [0.0 = disabled]
  label_smoothing: 0.0

  # LR warmup (linear ramp for first N epochs)
  warmup_epochs: 0

  # Patch-level dropout: randomly drop this fraction of patches each step
  patch_dropout: 0.0

  # Randomly shuffle patch order each step (breaks sequence bias)
  patch_shuffle: false

  # Maximum patches to load per slide (A_patches). null = use all patches.
  # Default: 800 (A_patches in reference implementation)
  max_patches: 800

experiment:
  # Sub-folder inside results/ for specific sweeping experiments
  name: default_experiment

# ─── HPO — Hyperparameter Optimisation ────────────────────────────────────────
# Used by: python main.py hpo --config config/config.yaml
hpo:
  study_name: mil_hpo       # name for the Optuna study
  n_trials: 30              # number of HP trials to run
  metric: val_auc           # val_auc | val_acc | val_f1
  direction: maximize       # maximize | minimize
  timeout_hours: null       # stop after N hours (null = run all n_trials)
  epochs_per_trial: 30      # max training epochs per trial
  pruning: true             # use Optuna MedianPruner for early trial elimination

  # ── Search space ─────────────────────────────────────────────────────────────
  # Set a key to null to keep the value from config.yaml fixed (not tuned).
  # For range parameters: [low, high].  For categorical: [choice1, choice2, ...]
  search_space:
    #clam_sb not working
    # model:               [abmil, clam_mb, mean_pool, transmil, dsmil]
    model:               [abmil]
    optimizer:           [AdamW, Adam]
    learning_rate:       [1.0e-4, 2.0e-3]     # log-uniform
    weight_decay:        [1.0e-5, 5.0e-3]     # log-uniform  (reg: up to 5e-3)
    beta1:               [0.5, 0.99]           # uniform (Adam β₁)
    beta2:               [0.9, 0.999]          # uniform (Adam β₂)
    eps:                 [1.0e-8, 1.0e-2]      # log-uniform (Adam ε)
    dropout:             [0.1, 0.6]            # uniform
    dropout_attn:        [0.2, 0.5]            # uniform
    dropout_classifier:  [0.1, 0.4]            # uniform
    attn_hidden_dim:     [32, 64, 128, 256]    # categorical
    proj_dim:            [256, 512]            # categorical
    lr_scheduler:        [cosine, step, plateau]  # categorical
    lr_factor:           [0.1, 0.9]            # uniform (plateau decay factor)
    lr_patience:         [5, 10, 20]           # categorical (plateau patience)
    label_smoothing:     [0.0, 0.15]           # uniform
    early_stop_patience: [10, 15, 20]          # categorical
    warmup_epochs:       [0, 2, 5]             # categorical
    patch_dropout:       [0.0, 0.3]          # uniform
    max_patches:         [800]  # A_patches search space [null, 600, 700, 800, 900, 1000, 1100, 1200]

# ─── Patch-Level Classifier ───────────────────────────────────────────────────
# Used by: python main.py classify --config config/config.yaml
patch_classifier:

  # Path to the pretrained classifier checkpoint (.pth).
  # Expected format: {model_cfg, num_classes, model_state, [class_names], [in_features]}
  checkpoint_path: "/home/naffi/projects/Scopium/Scopium/results/attention_mlp_best_hpo_train_val_test/best_model.pth"

  # Per-GPU batch size for inference (larger = faster; A100 can handle 2048+)
  batch_size: 512

  # Which feature files to read: 'h5' (reads h5_files/*.h5, has coords) or
  # 'pt' (reads pt_files/*.pt, coords will be sequential indices)
  input_format: h5

  # Tissue categories to keep when generating filtered feature files.
  # Leave empty ([]) or set to 'all' to generate filtered files for every class.
  # Supported classes: ADI, DEB, LYM, MUC, MUS, NOR, STR, TUM
  filter_categories:
    - TUM
    - STR

  # ── Heatmap Visualization ──────────────────────────────────────────────────
  # Used by: python main.py classify-heatmap --config config/config.yaml
  heatmap:

    # Which slides to visualize.
    # Options:
    #   all                       → all slides that have a prediction CSV
    #   "CMU-1"                   → single slide (also overridden by --slide CLI flag)
    #   [CMU-1, CMU-2, TCGA-AA]  → explicit subset
    slides: all

    # Which tissue categories to visualize.
    # Options:
    #   all                   → all 8 classes
    #   "TUM"                 → single class
    #   [TUM, STR, LYM]       → subset
    categories:
      - TUM
      - STR
      - LYM
      - NOR

    # Visualization mode:
    #   category_map  → one image per slide, each tile coloured by predicted class
    #                   (saves {slide_id}_category_map.png + class legend below)
    #   confidence    → one image per slide per category, jet colourmap = confidence
    #                   (saves {slide_id}_confidence_{CAT}.png + jet colorbar)
    mode: category_map

    # Overlay opacity [0.0 = transparent, 1.0 = opaque]
    alpha: 0.50

    # Number of highest-confidence tiles to save as individual crops per category.
    # Set to 0 to skip tile saving (only relevant in confidence mode).
    top_k_tiles: 10

  # ── Category colour palette (for reference) ──────────────────────────────────
  # ADI → tan       DEB → grey    LYM → purple  MUC → teal
  # MUS → orange    NOR → green   STR → blue     TUM → red


# ─── Cross-Validation ─────────────────────────────────────────────────────────
# Used by: python main.py crossval --config config/config.yaml
crossval:
  study_name: crossval
  n_folds: 5
  seed: 42


# ==============================================================================
# MULTI-LABEL MIL CONFIGURATION
# ==============================================================================
# Completely separate pipeline saved to results/multilabel/
# Tiling and feature extraction are shared with the single-label pipeline.

# ─── Multi-Label task ─────────────────────────────────────────────────────────
# Used by: python main.py multilabel-* --config config/config.yaml
multilabel:
  # Sub-name for this multi-label task (used in split/experiment directory names)
  task_name: multilabel_task

  # REQUIRED: ordered list of all possible label names.
  # The order defines the index in the binary label vector.
  # Example (NCT-CRC 9-class tissue): [ADI, DEB, LYM, MUC, MUS, NOR, STR, TUM, back]
  label_names: [TTN,TP53,MUC16]

  # Column auto-detection for slide IDs (null = auto-detect common names)
  slide_col: null

  # ── CSV format (choose one) ──────────────────────────────────────────────────
  # Option A — Binary columns (one column per label, 0/1 values):
  #   slide_id, ADI, DEB, LYM, MUC, MUS, NOR, STR, TUM
  #   TCGA-XX,   1,   0,   1,   0,   0,   0,   1,   0
  binary_columns: true

  # Option B — String column (one comma-separated column):
  #   slide_id, labels
  #   TCGA-XX, "ADI,LYM,STR"
  # Set binary_columns: false and set labels_string_col to the column name.
  labels_string_col: null   # e.g. "labels"

  # Sigmoid decision threshold for binary predictions [0.0, 1.0]
  # Predictions: (sigmoid(logit) > threshold) → 1 (positive label present)
  threshold: 0.5

# ─── Multi-Label Training ─────────────────────────────────────────────────────
# Used by: python main.py multilabel-train --config config/config.yaml
multilabel_training:
  max_epochs: 100

  # ── Optimizer ────────────────────────────────────────────────────────────────
  optimizer: AdamW             # Adam | AdamW

  # Learning rate. Default: 2e-3
  learning_rate: 2.0e-3

  # L2 regularization / weight decay. Default: 1e-3
  weight_decay: 1.0e-3

  # Adam β₁ — first moment decay rate. Default: 0.75
  beta1: 0.75

  # Adam β₂ — second moment decay rate. Default: 0.95
  beta2: 0.95

  # Adam ε — numerical stability constant. Default: 1e-2
  eps: 1.0e-2

  # ── LR Scheduler ─────────────────────────────────────────────────────────────
  lr_scheduler: plateau        # plateau | cosine | step

  # Plateau decay factor. Default: 0.75
  lr_scheduler_factor: 0.75

  # Plateau patience (epochs). Default: 20
  lr_scheduler_patience: 20

  # LR warmup (linear ramp over first N epochs)
  warmup_epochs: 0

  # ── Early stopping ───────────────────────────────────────────────────────────
  early_stopping: true
  early_stopping_patience: 20
  early_stopping_min_epochs: 10

  # ── Loss function ─────────────────────────────────────────────────────────────
  # bce   : BCEWithLogitsLoss (default)
  # focal : Focal loss — (1 - p)^gamma * BCE
  loss: bce

  # Per-label positive weighting (pos_weight = neg_count / pos_count, clamped).
  # Helps with class imbalance. Recommended: true
  weighted_loss: true

  # Clips target labels to [eps, 1-eps] — mild label smoothing for multi-label
  label_smoothing: 0.05

  # Focal loss parameters (only used when loss: focal)
  focal_alpha: 0.25
  focal_gamma: 2.0

  # Metric to use for best-checkpoint selection
  # Options: macro_auc | micro_auc | macro_f1 | micro_f1 | subset_acc
  monitor_metric: macro_auc

  # ── Bag-level regularisation ─────────────────────────────────────────────────
  # Dropout fraction of patches per step (patch_dropout)
  patch_dropout: 0.0
  # Shuffle patch order each step
  patch_shuffle: false
  # Maximum patches per slide (A_patches). Default: 800
  max_patches: 800

  # DataLoader workers (inherits from training.num_workers if not set)
  # num_workers: 0


# ─── Multi-Label HPO ──────────────────────────────────────────────────────────
# Used by: python main.py multilabel-hpo --config config/config.yaml
multilabel_hpo:
  study_name: ml_hpo
  n_trials: 30
  epochs_per_trial: 30
  n_folds: 1               # 1 = train/val split; >1 = k-fold within each trial
  metric: val_macro_auc    # val_macro_auc | val_micro_auc | val_macro_f1
  direction: maximize
  pruning: true
  timeout_hours: null      # stop after N hours (null = run all n_trials)

  # Pin a specific HPO run for --use_best_config (null = auto-select most recent)
  best_run_path: null

  # ── Search space ──────────────────────────────────────────────────────────────
  # Ranges/choices for each hyperparameter.
  # Set a key to null to keep the config.yaml value fixed.
  search_space:
    model:               [abmil, clam_sb, clam_mb, mean_pool, transmil, dsmil]
    optimizer:           [AdamW, Adam]
    learning_rate:       [1.0e-4, 2.0e-3]
    weight_decay:        [1.0e-5, 5.0e-3]
    beta1:               [0.5, 0.99]
    beta2:               [0.9, 0.999]
    eps:                 [1.0e-8, 1.0e-2]
    dropout:             [0.1, 0.6]
    dropout_attn:        [0.2, 0.5]
    dropout_classifier:  [0.1, 0.4]
    attn_hidden_dim:     [32, 64, 128, 256]
    feature_proj_dim:    [256, 512]
    lr_scheduler:        [cosine, step, plateau]
    lr_factor:           [0.1, 0.9]
    lr_patience:         [5, 10, 20]
    label_smoothing:     [0.0, 0.15]
    early_stop_patience: [10, 15, 20]
    warmup_epochs:       [0, 2, 5]
    patch_dropout:       [0.0, 0.3]
    patch_shuffle:       [true, false]
    max_patches:         [600, 700, 800, 900, 1000, 1100, 1200]  # A_patches search space
    loss:                [bce, focal]
    focal_gamma:         [1.0, 3.0]
    threshold:           [0.3, 0.7]


# ─── Multi-Label Cross-Validation ─────────────────────────────────────────────
# Used by: python main.py multilabel-crossval --config config/config.yaml
multilabel_crossval:
  study_name: ml_crossval
  n_folds: 5
  seed: 42


# ─── Multi-Label Splitting ────────────────────────────────────────────────────
# Used by: python main.py multilabel-split --config config/config.yaml --csv ...
# Inherits split.type, split.test_size etc. from the split: section above,
# unless overridden here.
multilabel_split:
  type: train_val_test   # train_test | train_val_test
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42
  # Stratification uses IterativeStratification (skmultilearn) if available,
  # falls back to random split with a warning.
